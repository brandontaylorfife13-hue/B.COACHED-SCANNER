name = "bcoached-push"
main = "src/index.js"
compatibility_date = "2026-11-15"
workers_dev = true

# UK 06:00 is 06:00 UTC in winter and 05:00 UTC in summer.
# The Worker checks Europe/London time and sends only on the matching run.
[triggers]
crons = ["0 5,6 * * *"]

[observability]
enabled = true
